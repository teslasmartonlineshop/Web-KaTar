<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2c7a7b">
  <meta name="description" content="Daftar semua berita Karang Taruna (Putra Asmara)">
  <title>Semua Berita — Karang Taruna (Putra Asmara)</title>
  <style>
    :root {
      --primary: #2c7a7b;
      --primary2: #245f60;
      --green: #38b2ac;
      --teal: #319795;
      --bg: #f5f7f6;
      --surface: #fff;
      --surface2: #eef6f0;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --shadow: 0 12px 35px rgba(15,23,42,.08);
      --radius: 16px;
      --card-shadow: 0 10px 30px rgba(44,122,123,.12);
      --transition: 0.35s cubic-bezier(.2,.8,.2,1);
    }
    [data-theme=dark] {
      --bg: #07110c;
      --surface: #0d1912;
      --surface2: #112319;
      --text: #e7f4eb;
      --muted: #9bb0a1;
      --line: #20352a;
      --shadow: 0 15px 40px rgba(0,0,0,.28);
      --card-shadow: 0 10px 25px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background var(--transition), color var(--transition);
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    button { cursor: pointer; border: 0; background: transparent; }
    .container {
      width: min(1120px, calc(100% - 32px));
      margin: auto;
    }

    /* ===== HEADER ===== */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
      transition: .25s;
    }
    .header.scrolled { box-shadow: var(--shadow); }
    .header-inner {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .back-btn {
      border: 0;
      background: var(--surface2);
      color: var(--primary);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 20px;
      transition: all .2s;
    }
    .back-btn:hover { background: var(--line); transform: scale(0.95); }
    .header-title {
      flex: 1;
      text-align: center;
      font-size: 15px;
      font-weight: 800;
    }
    .header-title small {
      display: block;
      font-size: 10px;
      font-weight: 400;
      color: var(--muted);
      opacity: .7;
      margin-top: 2px;
    }
    .theme-toggle {
      border: 0;
      background: var(--surface2);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 18px;
      color: var(--text);
      transition: all .2s;
    }
    .theme-toggle:hover { background: var(--line); transform: scale(0.95); }

    /* ===== FILTER ===== */
    .filter-section {
      padding: 20px 0 8px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .filter-section::-webkit-scrollbar { height: 4px; }
    .filter-section::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
    .filter-wrap {
      display: inline-flex;
      gap: 8px;
      padding-bottom: 8px;
    }
    .filter-btn {
      padding: 8px 18px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 800;
      background: var(--surface);
      border: 2px solid var(--line);
      color: var(--muted);
      transition: all .2s;
      white-space: nowrap;
    }
    .filter-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }
    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 4px 16px rgba(44,122,123,.3);
    }

    /* ===== NEWS COUNT ===== */
    .news-count {
      padding: 8px 0 16px;
      font-size: 13px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }
    .news-count strong { color: var(--text); }

    /* ===== NEWS LIST ===== */
    .news-list {
      display: grid;
      gap: 20px;
    }

    /* ===== NEWS CARD ===== */
    .news-card {
      display: flex;
      gap: 20px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      overflow: hidden;
      box-shadow: var(--card-shadow);
      transition: all .3s;
      cursor: pointer;
    }
    .news-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 45px rgba(44,122,123,.15);
      border-color: var(--primary);
    }
    .news-card-image {
      flex: 0 0 280px;
      height: 200px;
      overflow: hidden;
      background: var(--surface2);
    }
    .news-card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s;
    }
    .news-card:hover .news-card-image img {
      transform: scale(1.03);
    }
    .news-card-body {
      flex: 1;
      padding: 18px 20px 18px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .news-card-category {
      display: inline-block;
      padding: 3px 12px;
      background: var(--surface2);
      color: var(--primary);
      border-radius: 99px;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 8px;
      align-self: flex-start;
    }
    .news-card-title {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .news-card-excerpt {
      font-size: 14px;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 10px;
      line-height: 1.6;
    }
    .news-card-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .news-card-meta span { display: flex; align-items: center; gap: 4px; }
    .news-card-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 800;
      color: var(--primary);
      transition: all .2s;
    }
    .news-card-link:hover {
      gap: 12px;
      color: var(--primary2);
    }

    /* ===== LOADING & EMPTY ===== */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      gap: 16px;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid var(--line);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p { color: var(--muted); font-size: 14px; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state h3 { font-size: 20px; margin-bottom: 6px; }
    .empty-state p { color: var(--muted); }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 100;
      max-width: 340px;
      padding: 12px 18px;
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(15px);
      pointer-events: none;
      transition: .25s;
      font-size: 13px;
      font-weight: 700;
    }
    .toast.show { opacity: 1; transform: none; pointer-events: auto; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 820px) {
      .news-card {
        flex-direction: column;
      }
      .news-card-image {
        flex: 0 0 auto;
        height: 200px;
        width: 100%;
      }
      .news-card-body {
        padding: 16px 18px 18px;
      }
      .news-card-title { font-size: 18px; }
      .container { width: calc(100% - 16px); }
    }
    @media (max-width: 480px) {
      .header-inner { min-height: 56px; }
      .back-btn { width: 36px; height: 36px; font-size: 18px; }
      .header-title { font-size: 13px; }
      .filter-btn { padding: 6px 14px; font-size: 11px; }
      .news-card-image { height: 160px; }
      .news-card-title { font-size: 16px; }
      .news-card-excerpt { font-size: 13px; -webkit-line-clamp: 3; }
      .news-card-body { padding: 12px 14px 14px; }
    }
  </style>
</head>
<body>

<header class="header" id="header">
  <div class="container header-inner">
    <button class="back-btn" onclick="goBack()" aria-label="Kembali">←</button>
    <div class="header-title">
      Semua Berita
      <small>Karang Taruna (Putra Asmara)</small>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Tema" id="themeBtn">☾</button>
  </div>
</header>

<main>
  <div class="container">

    <!-- FILTER KATEGORI -->
    <section class="filter-section">
      <div class="filter-wrap" id="filterWrap">
        <button class="filter-btn active" data-filter="all" onclick="filterNews('all')">📰 Semua</button>
        <button class="filter-btn" data-filter="Kepemudaan" onclick="filterNews('Kepemudaan')">🧑‍🤝‍🧑 Kepemudaan</button>
        <button class="filter-btn" data-filter="Sosial" onclick="filterNews('Sosial')">❤️ Sosial</button>
        <button class="filter-btn" data-filter="UMKM" onclick="filterNews('UMKM')">🛍️ UMKM</button>
        <button class="filter-btn" data-filter="Pengumuman" onclick="filterNews('Pengumuman')">📢 Pengumuman</button>
        <button class="filter-btn" data-filter="Kegiatan" onclick="filterNews('Kegiatan')">📅 Kegiatan</button>
        <button class="filter-btn" data-filter="Olahraga" onclick="filterNews('Olahraga')">🏆 Olahraga</button>
        <button class="filter-btn" data-filter="Seni & Budaya" onclick="filterNews('Seni & Budaya')">🎨 Seni & Budaya</button>
      </div>
    </section>

    <!-- NEWS COUNT -->
    <div class="news-count" id="newsCount">Menampilkan <strong>0</strong> berita</div>

    <!-- NEWS LIST -->
    <div class="news-list" id="newsList">
      <!-- Loading State -->
      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <p>Memuat berita...</p>
      </div>
    </div>

  </div>
</main>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ===== KONFIGURASI API =====
const API_URL = 'https://script.google.com/macros/s/AKfycbz2xDxGq1IM1eOC3XRe8B95p4e8CYpHn2nj1n51auY3TUHOEidmwRKSK3tlWfbx7pwgGA/exec';

// ===== STATE =====
let allNews = [];
let currentFilter = 'all';
let isLoaded = false;

// ===== UTILITY =====
const $ = id => document.getElementById(id);
const toast = msg => {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
};

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[char]));
}

function formatDateFull(value) {
  if (!value) return '—';
  const d = new Date(value);
  if (isNaN(d.getTime())) return String(value);
  const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  return `${days[d.getDay()]}, ${d.getDate()} ${['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][d.getMonth()]} ${d.getFullYear()}`;
}

function formatTime(value) {
  if (!value) return '';
  const d = new Date(value);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}

function toggleTheme() {
  const dark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = dark ? '' : 'dark';
  localStorage.setItem('theme', dark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = dark ? '☾' : '☀';
}

function goBack() {
  if (history.length > 1) {
    history.back();
  } else {
    location.href = 'index.html#berita';
  }
}

// ===== FETCH NEWS =====
async function fetchNews() {
  try {
    const response = await fetch(API_URL + '?action=getAll', {
      method: 'GET',
      cache: 'no-store'
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const result = await response.json();
    if (result && result.success && result.data && result.data.news) {
      return result.data.news;
    }
    return null;
  } catch (error) {
    console.warn('Fetch news error:', error);
    return null;
  }
}

// ===== RENDER NEWS LIST =====
function renderNewsList(news) {
  const list = $('newsList');
  const count = $('newsCount');
  
  // Filter berita yang statusnya Published
  const published = news.filter(item => item.status === 'Published' || !item.status);
  
  if (published.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="icon">📰</div>
        <h3>Belum Ada Berita</h3>
        <p>Belum ada berita yang dipublikasikan. Silakan cek kembali nanti.</p>
      </div>
    `;
    count.innerHTML = 'Menampilkan <strong>0</strong> berita';
    return;
  }

  // Urutkan dari yang terbaru
  const sorted = published.sort((a, b) => {
    const dateA = new Date(a.date || 0);
    const dateB = new Date(b.date || 0);
    return dateB - dateA;
  });

  count.innerHTML = `Menampilkan <strong>${sorted.length}</strong> berita`;

  list.innerHTML = sorted.map(item => {
    const imageUrl = item.image || 'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80';
    const excerpt = item.excerpt || item.body?.slice(0, 150) || 'Klik untuk membaca selengkapnya...';
    const dateFull = formatDateFull(item.date);
    const time = formatTime(item.date);
    
    return `
      <div class="news-card" onclick="location.href='berita-detail.html?id=${item.id}'">
        <div class="news-card-image">
          <img src="${imageUrl}" alt="${esc(item.title)}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80'">
        </div>
        <div class="news-card-body">
          <span class="news-card-category">${esc(item.category || 'Umum')}</span>
          <h2 class="news-card-title">${esc(item.title || 'Berita Tanpa Judul')}</h2>
          <p class="news-card-excerpt">${esc(excerpt)}...</p>
          <div class="news-card-meta">
            <span>📅 ${dateFull}</span>
            ${time ? `<span>🕐 ${time}</span>` : ''}
          </div>
          <a class="news-card-link" href="berita-detail.html?id=${item.id}">Baca Selengkapnya →</a>
        </div>
      </div>
    `;
  }).join('');
}

// ===== FILTER NEWS =====
function filterNews(category) {
  currentFilter = category;
  
  // Update active button
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === category);
  });

  // Filter data
  let filtered = allNews;
  if (category !== 'all') {
    filtered = allNews.filter(item => item.category === category);
  }

  renderNewsList(filtered);
  
  // Scroll ke atas setelah filter
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== LOAD DATA =====
async function loadNews() {
  const list = $('newsList');
  const loading = $('loadingState');
  
  // Tampilkan loading
  list.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Memuat berita...</p>
    </div>
  `;

  try {
    // Coba ambil dari API
    const apiData = await fetchNews();
    
    if (apiData && apiData.length > 0) {
      allNews = apiData;
      // Simpan cache
      localStorage.setItem('KT_NEWS_CACHE_LIST', JSON.stringify(apiData));
    } else {
      // Coba dari cache
      const cached = localStorage.getItem('KT_NEWS_CACHE_LIST');
      if (cached) {
        const parsed = JSON.parse(cached);
        if (parsed && parsed.length > 0) {
          allNews = parsed;
          toast('⚠️ Mode offline — menampilkan data cache');
        } else {
          allNews = [];
        }
      } else {
        allNews = [];
      }
    }
  } catch (error) {
    console.warn('Load news error:', error);
    // Coba dari cache
    const cached = localStorage.getItem('KT_NEWS_CACHE_LIST');
    if (cached) {
      const parsed = JSON.parse(cached);
      if (parsed && parsed.length > 0) {
        allNews = parsed;
        toast('⚠️ Mode offline — menampilkan data cache');
      } else {
        allNews = [];
      }
    } else {
      allNews = [];
    }
  }

  // Render dengan filter 'all'
  filterNews('all');
  isLoaded = true;
}

// ===== HEADER SCROLL EFFECT =====
window.addEventListener('scroll', () => {
  document.getElementById('header').classList.toggle('scrolled', window.scrollY > 10);
});

// ===== THEME =====
if (localStorage.getItem('theme') === 'dark') {
  document.documentElement.dataset.theme = 'dark';
  document.getElementById('themeBtn').textContent = '☀';
}

// ===== KEYBOARD SHORTCUT =====
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') goBack();
});

// ===== INIT =====
loadNews();
</script>
</body>
</html>
